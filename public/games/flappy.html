<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Pixel Bird Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 400px;
      padding: 10px 16px;
      background: #0f172a;
      border-radius: 12px 12px 0 0;
      border: 1px solid #1e293b;
      border-bottom: none;
    }
    .stat-label { font-size: 10px; text-transform: uppercase; color: #94a3b8; }
    .stat-val { font-size: 18px; font-weight: 700; color: #38bdf8; font-variant-numeric: tabular-nums; }
    .canvas-box {
      position: relative;
      width: 100%;
      max-width: 400px;
      height: 520px;
      background: #082f49;
      border: 1px solid #1e293b;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      cursor: pointer;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      padding: 24px;
      text-align: center;
      backdrop-filter: blur(4px);
    }
    .overlay.hidden { display: none; }
    .overlay h2 { font-size: 26px; font-weight: 800; color: #f8fafc; }
    .overlay p { font-size: 14px; color: #94a3b8; max-width: 280px; line-height: 1.4; }
    .btn {
      background: #0284c7;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="hud">
    <div>
      <div class="stat-label">Score</div>
      <div class="stat-val" id="score">0</div>
    </div>
    <div>
      <div class="stat-label">High Score</div>
      <div class="stat-val" id="highScore">0</div>
    </div>
  </div>

  <div class="canvas-box" id="canvasBox">
    <canvas id="gameCanvas" width="380" height="520"></canvas>
    <div id="overlay" class="overlay">
      <h2 id="overlayTitle">Pixel Bird Arcade</h2>
      <p id="overlayDesc">Tap screen, Click, or press Space to flap wings and glide through the pipe conduits!</p>
      <button class="btn" id="startBtn">Start Flight</button>
    </div>
  </div>

  <div class="hint">Controls: Click, Touch or Space to Flap</div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlayTitle');
    const overlayDesc = document.getElementById('overlayDesc');
    const startBtn = document.getElementById('startBtn');
    const canvasBox = document.getElementById('canvasBox');

    let highScore = parseInt(localStorage.getItem('flappy_high') || '0', 10);
    highScoreEl.textContent = highScore;

    let score = 0;
    let isPlaying = false;
    let frames = 0;

    const bird = {
      x: 60,
      y: 200,
      radius: 14,
      gravity: 0.28,
      velocity: 0,
      jump: -5.8,
      rotation: 0
    };

    let pipes = [];
    const PIPE_WIDTH = 52;
    const PIPE_GAP = 125;

    function resetGame() {
      bird.y = 220;
      bird.velocity = 0;
      bird.rotation = 0;
      pipes = [];
      score = 0;
      frames = 0;
      scoreEl.textContent = '0';
      isPlaying = true;
      overlay.classList.add('hidden');
    }

    function flap() {
      if (!isPlaying) return;
      bird.velocity = bird.jump;
    }

    function gameOver() {
      isPlaying = false;
      overlayTitle.textContent = 'Crashed!';
      overlayDesc.textContent = `Score: ${score} · Best: ${highScore}`;
      startBtn.textContent = 'Fly Again';
      overlay.classList.remove('hidden');
    }

    function update() {
      if (!isPlaying) return;
      frames++;

      bird.velocity += bird.gravity;
      bird.y += bird.velocity;

      // Floor & ceiling collisions
      if (bird.y + bird.radius >= canvas.height - 30) {
        bird.y = canvas.height - 30 - bird.radius;
        return gameOver();
      }
      if (bird.y - bird.radius <= 0) {
        bird.y = bird.radius;
        bird.velocity = 0;
      }

      // Bird tilt
      bird.rotation = Math.min(Math.PI / 4, Math.max(-Math.PI / 4, (bird.velocity / 10) * (Math.PI / 4)));

      // Spawn pipes
      if (frames % 100 === 0) {
        const topHeight = Math.floor(Math.random() * (canvas.height - PIPE_GAP - 120)) + 40;
        pipes.push({
          x: canvas.width,
          top: topHeight,
          bottom: canvas.height - 30 - (topHeight + PIPE_GAP),
          passed: false
        });
      }

      // Update pipes
      pipes.forEach((p, idx) => {
        p.x -= 2.2;

        // Collision detection
        if (
          bird.x + bird.radius > p.x &&
          bird.x - bird.radius < p.x + PIPE_WIDTH
        ) {
          if (
            bird.y - bird.radius < p.top ||
            bird.y + bird.radius > canvas.height - 30 - p.bottom
          ) {
            gameOver();
          }
        }

        // Score pass
        if (!p.passed && p.x + PIPE_WIDTH < bird.x) {
          p.passed = true;
          score++;
          scoreEl.textContent = score;
          if (score > highScore) {
            highScore = score;
            highScoreEl.textContent = highScore;
            localStorage.setItem('flappy_high', highScore);
          }
        }

        if (p.x < -PIPE_WIDTH) {
          pipes.splice(idx, 1);
        }
      });
    }

    function draw() {
      // Sky gradient
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#0284c7');
      grad.addColorStop(0.7, '#38bdf8');
      grad.addColorStop(1, '#bae6fd');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      // Distant clouds
      ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
      ctx.beginPath();
      ctx.arc(80, 80, 30, 0, Math.PI * 2);
      ctx.arc(110, 75, 40, 0, Math.PI * 2);
      ctx.arc(140, 80, 28, 0, Math.PI * 2);
      ctx.fill();

      // Pipes
      pipes.forEach(p => {
        ctx.fillStyle = '#10b981';
        ctx.strokeStyle = '#065f46';
        ctx.lineWidth = 2;

        // Top pipe
        ctx.fillRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.strokeRect(p.x, 0, PIPE_WIDTH, p.top);
        ctx.fillRect(p.x - 3, p.top - 18, PIPE_WIDTH + 6, 18);
        ctx.strokeRect(p.x - 3, p.top - 18, PIPE_WIDTH + 6, 18);

        // Bottom pipe
        const bottomY = canvas.height - 30 - p.bottom;
        ctx.fillRect(p.x, bottomY, PIPE_WIDTH, p.bottom);
        ctx.strokeRect(p.x, bottomY, PIPE_WIDTH, p.bottom);
        ctx.fillRect(p.x - 3, bottomY, PIPE_WIDTH + 6, 18);
        ctx.strokeRect(p.x - 3, bottomY, PIPE_WIDTH + 6, 18);
      });

      // Ground
      ctx.fillStyle = '#166534';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 30);
      ctx.fillStyle = '#15803d';
      ctx.fillRect(0, canvas.height - 30, canvas.width, 6);

      // Bird
      ctx.save();
      ctx.translate(bird.x, bird.y);
      ctx.rotate(bird.rotation);

      // Bird body
      ctx.fillStyle = '#facc15';
      ctx.beginPath();
      ctx.arc(0, 0, bird.radius, 0, Math.PI * 2);
      ctx.fill();

      // Wing
      ctx.fillStyle = '#eab308';
      ctx.beginPath();
      ctx.ellipse(-4, 2, 7, 5, 0, 0, Math.PI * 2);
      ctx.fill();

      // Eye
      ctx.fillStyle = '#ffffff';
      ctx.beginPath();
      ctx.arc(5, -4, 4, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = '#0f172a';
      ctx.beginPath();
      ctx.arc(6, -4, 2, 0, Math.PI * 2);
      ctx.fill();

      // Beak
      ctx.fillStyle = '#f97316';
      ctx.beginPath();
      ctx.moveTo(11, -1);
      ctx.lineTo(19, 2);
      ctx.lineTo(11, 6);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === ' ' || e.key === 'ArrowUp') {
        if (!isPlaying && overlay.classList.contains('hidden') === false) {
          resetGame();
        } else {
          flap();
        }
        e.preventDefault();
      }
    });

    canvasBox.addEventListener('pointerdown', (e) => {
      if (!isPlaying) {
        if (!overlay.classList.contains('hidden')) return;
      }
      flap();
    });

    startBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      resetGame();
    });

    requestAnimationFrame(loop);
  </script>
</body>
</html>
