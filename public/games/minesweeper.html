<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Minesweeper Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body {
      background: #090d16;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
      touch-action: manipulation;
    }
    .wrapper {
      background: #0f172a;
      border: 1px solid #1e293b;
      border-radius: 12px;
      padding: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .top-panel {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      background: #020617;
      padding: 10px 16px;
      border-radius: 8px;
      border: 1px solid #1e293b;
      margin-bottom: 12px;
    }
    .lcd {
      background: #000;
      color: #ef4444;
      font-family: monospace;
      font-size: 22px;
      font-weight: 700;
      padding: 4px 8px;
      border-radius: 4px;
      border: 1px solid #334155;
      min-width: 60px;
      text-align: center;
      letter-spacing: 2px;
    }
    .face-btn {
      font-size: 24px;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 8px;
      width: 42px;
      height: 42px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: transform 0.1s;
    }
    .face-btn:active { transform: scale(0.92); }
    .grid {
      display: grid;
      gap: 3px;
      background: #1e293b;
      padding: 4px;
      border-radius: 8px;
      border: 1px solid #334155;
    }
    .cell {
      width: 32px;
      height: 32px;
      background: #334155;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 15px;
      cursor: pointer;
      transition: background 0.1s;
    }
    .cell:hover { background: #475569; }
    .cell.revealed {
      background: #0f172a;
      cursor: default;
    }
    .cell.flagged { color: #f43f5e; font-size: 16px; }
    .cell.mine { background: #ef4444; }
    .cell[data-num="1"] { color: #38bdf8; }
    .cell[data-num="2"] { color: #4ade80; }
    .cell[data-num="3"] { color: #f87171; }
    .cell[data-num="4"] { color: #818cf8; }
    .cell[data-num="5"] { color: #f59e0b; }
    .cell[data-num="6"] { color: #2dd4bf; }
    .cell[data-num="7"] { color: #e879f9; }
    .cell[data-num="8"] { color: #94a3b8; }
    .controls {
      display: flex;
      gap: 10px;
      margin-top: 12px;
      width: 100%;
      justify-content: space-between;
    }
    .flag-toggle {
      background: #1e293b;
      border: 1px solid #334155;
      color: #94a3b8;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .flag-toggle.active {
      background: #f43f5e;
      color: white;
      border-color: #f43f5e;
    }
    .hint {
      margin-top: 10px;
      font-size: 12px;
      color: #64748b;
      text-align: center;
    }
  </style>
</head>
<body>

  <div class="wrapper">
    <div class="top-panel">
      <div class="lcd" id="minesLcd">010</div>
      <button class="face-btn" id="faceBtn">🙂</button>
      <div class="lcd" id="timerLcd">000</div>
    </div>

    <div class="grid" id="grid"></div>

    <div class="controls">
      <button class="flag-toggle" id="flagModeBtn">🚩 Flag Mode: OFF</button>
      <button class="flag-toggle" id="diffBtn">Level: 9x9 (10 Mines)</button>
    </div>
  </div>

  <div class="hint">Left Click to uncover · Right Click to place Flag 🚩</div>

  <script>
    const gridEl = document.getElementById('grid');
    const minesLcd = document.getElementById('minesLcd');
    const timerLcd = document.getElementById('timerLcd');
    const faceBtn = document.getElementById('faceBtn');
    const flagModeBtn = document.getElementById('flagModeBtn');
    const diffBtn = document.getElementById('diffBtn');

    let rows = 9;
    let cols = 9;
    let totalMines = 10;
    let grid = [];
    let isGameOver = false;
    let firstClick = true;
    let flagMode = false;
    let timer = 0;
    let timerInterval = null;
    let flaggedCount = 0;

    function init() {
      clearInterval(timerInterval);
      timer = 0;
      timerLcd.textContent = '000';
      isGameOver = false;
      firstClick = true;
      flaggedCount = 0;
      faceBtn.textContent = '🙂';
      updateMinesDisplay();

      grid = [];
      gridEl.style.gridTemplateColumns = `repeat(${cols}, 32px)`;
      gridEl.innerHTML = '';

      for (let r = 0; r < rows; r++) {
        grid[r] = [];
        for (let c = 0; c < cols; c++) {
          const cellData = {
            r,
            c,
            isMine: false,
            isRevealed: false,
            isFlagged: false,
            neighborMines: 0,
            el: null
          };

          const el = document.createElement('div');
          el.className = 'cell';
          el.addEventListener('click', (e) => handleClick(r, c));
          el.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            toggleFlag(r, c);
          });

          cellData.el = el;
          grid[r][c] = cellData;
          gridEl.appendChild(el);
        }
      }
    }

    function updateMinesDisplay() {
      const remaining = Math.max(0, totalMines - flaggedCount);
      minesLcd.textContent = String(remaining).padStart(3, '0');
    }

    function plantMines(safeR, safeC) {
      let planted = 0;
      while (planted < totalMines) {
        const r = Math.floor(Math.random() * rows);
        const c = Math.floor(Math.random() * cols);
        if ((r === safeR && c === safeC) || grid[r][c].isMine) continue;
        grid[r][c].isMine = true;
        planted++;
      }

      // Calculate neighbor counts
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (grid[r][c].isMine) continue;
          let count = 0;
          for (let dr = -1; dr <= 1; dr++) {
            for (let dc = -1; dc <= 1; dc++) {
              const nr = r + dr, nc = c + dc;
              if (nr >= 0 && nr < rows && nc >= 0 && nc < cols && grid[nr][nc].isMine) {
                count++;
              }
            }
          }
          grid[r][c].neighborMines = count;
        }
      }
    }

    function startTimer() {
      timerInterval = setInterval(() => {
        timer = Math.min(999, timer + 1);
        timerLcd.textContent = String(timer).padStart(3, '0');
      }, 1000);
    }

    function handleClick(r, c) {
      if (isGameOver) return;
      if (flagMode) {
        return toggleFlag(r, c);
      }

      const cell = grid[r][c];
      if (cell.isFlagged || cell.isRevealed) return;

      if (firstClick) {
        firstClick = false;
        plantMines(r, c);
        startTimer();
      }

      if (cell.isMine) {
        // Detonation!
        revealMine(r, c);
        return;
      }

      revealCell(r, c);
      checkWin();
    }

    function toggleFlag(r, c) {
      if (isGameOver) return;
      const cell = grid[r][c];
      if (cell.isRevealed) return;

      cell.isFlagged = !cell.isFlagged;
      if (cell.isFlagged) {
        cell.el.textContent = '🚩';
        cell.el.classList.add('flagged');
        flaggedCount++;
      } else {
        cell.el.textContent = '';
        cell.el.classList.remove('flagged');
        flaggedCount--;
      }
      updateMinesDisplay();
    }

    function revealCell(r, c) {
      const cell = grid[r][c];
      if (cell.isRevealed || cell.isFlagged) return;

      cell.isRevealed = true;
      cell.el.classList.add('revealed');

      if (cell.neighborMines > 0) {
        cell.el.textContent = cell.neighborMines;
        cell.el.setAttribute('data-num', cell.neighborMines);
      } else {
        // Flood fill zeros
        for (let dr = -1; dr <= 1; dr++) {
          for (let dc = -1; dc <= 1; dc++) {
            const nr = r + dr, nc = c + dc;
            if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) {
              revealCell(nr, nc);
            }
          }
        }
      }
    }

    function revealMine(hitR, hitC) {
      isGameOver = true;
      clearInterval(timerInterval);
      faceBtn.textContent = '😵';

      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          const cell = grid[r][c];
          if (cell.isMine) {
            cell.el.classList.add('mine');
            cell.el.textContent = '💣';
          }
        }
      }
    }

    function checkWin() {
      let unrevealedSafe = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (!grid[r][c].isMine && !grid[r][c].isRevealed) {
            unrevealedSafe++;
          }
        }
      }

      if (unrevealedSafe === 0) {
        isGameOver = true;
        clearInterval(timerInterval);
        faceBtn.textContent = '😎';
        minesLcd.textContent = '000';
      }
    }

    flagModeBtn.addEventListener('click', () => {
      flagMode = !flagMode;
      flagModeBtn.textContent = flagMode ? '🚩 Flag Mode: ON' : '🚩 Flag Mode: OFF';
      flagModeBtn.classList.toggle('active', flagMode);
    });

    diffBtn.addEventListener('click', () => {
      if (rows === 9) {
        rows = 12;
        cols = 12;
        totalMines = 20;
        diffBtn.textContent = 'Level: 12x12 (20 Mines)';
      } else {
        rows = 9;
        cols = 9;
        totalMines = 10;
        diffBtn.textContent = 'Level: 9x9 (10 Mines)';
      }
      init();
    });

    faceBtn.addEventListener('click', init);

    init();
  </script>
</body>
</html>
